# Tooling configuration for the backend (pytest + ruff).

[tool.pytest.ini_options]
pythonpath = ["."]          # so tests can `import app...` when run from backend/
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Real-bug + hygiene rules. Line length (E501) is left to the formatter.
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern intentionally calls these in defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
