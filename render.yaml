# Render Blueprint: one Docker web service (single-service — serves API + SPA).
# Postgres is external (Neon), supplied via the DATABASE_URL secret below.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: finance-ai
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .                 # repo root — image needs frontend/, backend/, data/
    healthCheckPath: /api/health
    autoDeploy: true                 # merge to main -> build -> migrate -> deploy
    # No dockerCommand: the image's CMD (backend/start.sh) applies migrations then
    # starts uvicorn on $PORT. Render tokenizes dockerCommand into argv without a
    # shell, so `&&` there is passed as a literal arg — the script avoids that.
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL           # paste the Neon connection string in the dashboard
        sync: false
      - key: JWT_SECRET             # Render generates a strong random value
        generateValue: true
      - key: FRONTEND_ORIGIN        # set to this service's own https URL once known
        sync: false
      - key: GOOGLE_API_KEY         # optional; blank -> deterministic rule-based query
        sync: false
